[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bossgreet"
version = "1.0.0"
description = "Windows 本机使用的 BOSS 直聘岗位预览与可选打招呼工具"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "bossgreet contributors" }]
keywords = ["boss", "zhipin", "cdp", "automation", "job"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Office/Business",
]
dependencies = [
    "websocket-client>=1.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# 真实 OS 键鼠通道（input_mode: os）—— 默认通道 cdp 不需要
osinput = ["pyautogui>=0.9.54", "pyperclip>=1.8"]
# 用模型逐条写招呼语（message.generator: llm）
llm = ["requests>=2.31"]
dev = ["pytest>=8.0"]

[project.scripts]
bossgreet = "bossgreet.cli:main"

[tool.setuptools.packages.find]
include = ["bossgreet*"]

[tool.setuptools.package-data]
"bossgreet" = ["examples/*.yaml"]
"bossgreet.messaging" = ["templates.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
