# ============ bossgreet 运行配置（模板）============
# 用法：复制成 config.yaml 后按需修改（Windows PowerShell 示例见 README）
#
# 下面的搜索方向和城市只是虚构的配置示范；运行前必须改成自己的目标。
# 换方向时最常改的三处：search_queries / keywords / exclude_keywords。

browser:
  # 程序按此选择并自动启动本机浏览器。可选 edge / chrome。
  name: "edge"
  auto_start: true
  # 留空时自动寻找浏览器程序；找不到时填本机 exe 完整路径。
  executable: ""
  # 留空时使用本机 LOCALAPPDATA 下的专用目录，不复用日常浏览器资料。
  user_data_dir: ""
  # 本机调试端口；若已被另一种浏览器占用，程序会停止而非误连。
  cdp_url: "http://127.0.0.1:9222"

  # 输入通道（决定会不会占用你的鼠标）：
  #   cdp ★默认 —— 用 CDP 派发鼠标/键盘事件：全程不动真实光标、不抢前台焦点。
  #                 唯一硬约束：浏览器窗口必须【可见】（可以被遮住，但不能最小化）。
  #   os        —— pyautogui 真实 OS 键鼠。抗风控更强，但会占用鼠标、且窗口要在前台。
  #                注意：只认显式 --os-input，光在配置里写 os 会被强制改回 cdp。
  input_mode: "cdp"

  # 运行前把窗口挪到屏幕外（left=-32000）：不出现在你眼前、也吃不到你的鼠标。
  # false 则窗口留在屏幕上（方便你盯着看，但会挡住工作区）。
  park_window: true

# ---------- 搜索词：一个词 = 一轮搜索，逐个跑完再换下一个 ----------
# 建议：先给 3~5 个核心词跑一轮看命中质量，再按命中情况补词。
# 实测经验：池子见底时，**加新搜索词**比放宽过滤门槛有效得多。
search_queries:
  - "嵌入式 实习"
  - "嵌入式软件 实习"
  - "单片机 实习"
  - "硬件工程师 实习"
  - "物联网 实习"

# ---------- 过滤规则（五层门槛，按顺序过，任何一层不过就丢）----------

# 目标关键词（职位名命中【任一】即保留）
keywords:
  - "嵌入式"
  - "单片机"
  - "硬件"
  - "电子"
  - "固件"
  - "物联网"

# 方向必含词（职位名必须命中【至少一个】，锁死职能方向）
# 为什么需要它：搜「嵌入式实习」时 BOSS 会把销售、运营、客服一起推过来，
# 只靠上面的 OR 挡不住。这一层是 AND，专门砍跨职能岗位。
# ⚠ 方向词要【裸词 + 复合词都留】：只写「硬件工程师」会让「硬件实习生」
#   这类正经岗被误杀（标题里没有"工程师"三个字）。
must_keywords:
  - "嵌入式"
  - "单片机"
  - "硬件"
  - "电子"
  - "固件"
  - "物联网"

# 岗位性质门槛：只要实习/校招/应届。
# 用【职位名 + 卡片标签】合并匹配 —— BOSS 的校招岗常把性质只写在标签里
# （标签形如「在校/应届」），光看职位名会整批漏掉。
# 不需要这一层就置空（改成 []）。
entry_keywords:
  - "实习"
  - "校招"
  - "应届"
  - "在校"

# 排除关键词（职位名命中【任一】即丢弃，优先级高于上面所有）
exclude_keywords:
  # 非目标职能
  - "销售"
  - "运营"
  - "市场"
  - "客服"
  - "商务"
  - "人事"
  - "行政"
  - "文员"
  - "采购"
  - "讲师"
  - "培训"
  - "主播"
  - "直播"
  - "产品经理"
  # 资历明显高于应届（标题里带年限的直接砍）
  - "资深"
  - "专家"
  - "总监"
  - "架构师"
  - "负责人"
  - "CTO"
  - "3-5年"
  - "5-10年"
  - "10年以上"
  # 用工形式不对
  - "外包"
  - "众包"
  - "兼职"
  - "日结"
  - "驻场"

# 排除标签（卡片标签命中【任一】即丢弃）
# BOSS 卡片标签形如「深圳·南山区 1-3年 本科」，学历/年限门槛就写在里面。
# ⚠ 注意别收裸「助理」「见习」：研发助理、见习岗是实习可投的正经岗。
exclude_tags:
  - "中专"
  - "中技"
  - "高中"
  - "硕士"
  - "博士"
  - "3-5年"
  - "5-10年"
  - "10年以上"

filter:
  # 默认搜索城市（BOSS 的搜索 URL 一次只能带一个城市码）
  city: "广州"

  # 允许投递的【城市集合】。为什么要单独列一份：
  # 搜「广州」时 BOSS 会把「佛山·顺德区」的岗位一起推上来（广佛同城），
  # 若过滤只认单个城市，这些岗会被「城市不符」整批误杀。
  # 只有 city 一个城市时这里可以留空。
  cities:
    - "深圳"
    - "广州"
    - "东莞"
    - "佛山"
    - "珠海"

  # 薪资门槛。enabled: false = 完全不卡薪资（实习岗薪资区间乱，卡了容易误杀）。
  # 想卡就改成 true 并填窗口：日薪 100~250 元；月薪按 21.75 天折算后比较。
  # ⚠ BOSS 用自定义字体把薪资数字换成私有区码位，本工具会先解码再判断；
  #    万一解码不出来，一律放行（绝不因为读不懂就误杀岗位）。
  salary:
    enabled: false
    daily_min: 100
    daily_max: 250
    day_per_month: 21.75

  # 单次运行里同一家公司最多投几个岗（0 = 不限制）。
  # 同一个 HR 团队反复打招呼边际收益接近 0，还会拉高被判骚扰的概率。
  # 计数按归一化后的公司名（「上海星河技术有限公司」「星河云计算」都算「星河」）。
  max_per_company: 8

  # 公司黑名单（按归一化公司名匹配）。
  # 只放「招呼根本发不出去」的公司 —— 这类岗不会进记录文件，
  # 每轮都会被当成新岗位重试一次，纯浪费额度。
  skip_companies: []

  # 每个搜索词「滚到底加载更多」的轮数（BOSS 列表是无限滚动，每轮约 +15 条）。
  # 5 轮 ≈ 75 张卡片。
  max_pages: 5

pace:
  mode: "batch"
  # 每处理多少个岗位停一次等人确认（回车继续 / q 停止）。
  # 无人值守时 stdin 没有输入 → 按 q 处理 → 干净退出。
  # 请保持较小批次，以便逐批人工核对。
  batch_size: 10
  min_delay_s: 0.8
  max_delay_s: 1.8
  # 单次运行上限。BOSS 对每日沟通次数有限额，这里是自我保险。
  daily_limit: 40
  search_max_retry: 3
  search_retry_backoff_s: [15, 25]

message:
  # 生成器四选一（只在 send_custom_message: true 或 --custom 时才参与发送）：
  #   template —— 本地模板 + 槽位，按 JD 命中的技术栈组装（零成本、不联网）
  #   llm      —— 模型读完整 JD 后逐条写（需要 API Key）
  #   external —— 读 messages.json 按岗位键匹配，原样发送（由你预先生成）
  #   fixed    —— 所有岗位发同一条固定文案
  generator: "template"
  # fixed 模式用的文案：可以直接写在 fixed_text 里，也可以放文件里用 fixed_file 指。
  # ⚠ 这段内容会逐字发给 HR，请把示例换成你自己的介绍。
  fixed_text: ""
  fixed_file: ""
  # 消息长度上限（超出会先裁可选段落，再不行才截断）
  max_chars: 300

  llm:
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model: "qwen-plus"
    api_key_env: "LLM_API_KEY"    # 密钥只从环境变量读，别写进文件
    timeout_s: 60
    temperature: 0.7

  messages_file: "messages.json"

# ---------- 投递方式 ----------
#   false ★默认 —— 只点「立即沟通」，让 BOSS 发出你在
#                  「个人中心 → 打招呼语」里设置的那条默认招呼语。
#                  HR 只看到一条，也不会用到上面的生成器。
#   true          —— 打完招呼后，再到聊天页补发一条生成器产出的消息。
#                  注意：这时 HR 会连续看到【默认招呼语 + 定制消息】两条。
# 命令行可临时覆盖：--greet-only / --custom
outreach:
  send_custom_message: false

# 开了 --custom 时，打印一次"HR 会看到两条"的提醒
default_greeting_notice: true

# ---------- 状态文件位置 ----------
# 相对路径按当前工作目录解析。建议在自己的本地工作目录运行。
# ⚠ 这些文件里有你的真实投递历史，默认已被 .gitignore 排除，别提交。
paths:
  contacted: "contacted.json"
  jobs: "jobs.jsonl"
